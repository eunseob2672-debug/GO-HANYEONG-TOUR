<!DOCTYPE html>
<html lang="ko">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background: linear-gradient(180deg, #b8dcf8 0%, #e0f0ff 100%);
      touch-action: none;
    }
    #canvas-container { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .floating-label {
      position: fixed; top: 0; left: 0; z-index: 12; pointer-events: auto; cursor: pointer;
      user-select: none; transition: opacity 0.2s ease; will-change: transform;
    }
    .floating-label:hover { z-index: 18; }
    .context-label {
      position: fixed; top: 0; left: 0; z-index: 8; pointer-events: none;
      user-select: none; transition: opacity 0.2s ease; will-change: transform;
    }
    .hp-overlay {
      position: fixed; top: 0; left: 0; z-index: 15; pointer-events: none;
      user-select: none; will-change: transform;
    }
    @keyframes comboPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }
    .combo-pop { animation: comboPop 0.22s ease-out; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="select-none">

    const CAMERA_PRESETS = {

    // =========================================================================
    // 2. Web Audio API 합성 사운드 엔진
    // =========================================================================
    const SoundFX = {
      ctx: null, muted: false,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      playExplosion(intensity = 1.0) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110 * intensity, now);
        osc.frequency.exponentialRampToValueAtTime(24, now + 0.42);
        gain.gain.setValueAtTime(0.28 * intensity, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.48);

        const len = Math.floor(this.ctx.sampleRate * 0.4);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
        const noise = this.ctx.createBufferSource(); noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
        filter.frequency.setValueAtTime(880, now); filter.frequency.exponentialRampToValueAtTime(120, now + 0.4);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.3 * intensity, now); nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        noise.connect(filter); filter.connect(nGain); nGain.connect(this.ctx.destination);
        noise.start(now);
      },
      playLaser() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1150, now); osc.frequency.exponentialRampToValueAtTime(140, now + 0.35);
        gain.gain.setValueAtTime(0.22, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.4);
      },
      playQuake() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.95);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.sin((i / len) * Math.PI);
        const noise = this.ctx.createBufferSource(); noise.buffer = buf;
        const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(140, now);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.42, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
        noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
        noise.start(now);
      },
      playPropBreak(isElectric = false) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
        osc.type = isElectric ? 'square' : 'triangle';
        osc.frequency.setValueAtTime(isElectric ? 680 : 240, now);
        osc.frequency.exponentialRampToValueAtTime(isElectric ? 110 : 55, now + 0.16);
        gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.19);
      }
    };

      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor; ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = textColor;
      ctx.font = `800 ${fontSize}px "Noto Sans KR", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, width / 2, height / 2 + 2);

    function createGroundCrackTexture() {
      const size = 512, canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d'), cx = size / 2, cy = size / 2;
      const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, size * 0.42);
      grad.addColorStop(0, 'rgba(15, 23, 42, 0.92)');
      grad.addColorStop(0.3, 'rgba(30, 41, 59, 0.62)');
      grad.addColorStop(0.65, 'rgba(51, 65, 85, 0.2)');
      grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(cx, cy, size * 0.44, 0, Math.PI * 2); ctx.fill();

      for (let i = 0; i < 11; i++) {
        let angle = (i / 11) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
        let x = cx, y = cy;
        const segs = 5 + Math.floor(Math.random() * 4);
        const maxDist = size * (0.32 + Math.random() * 0.16);
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let s = 1; s <= segs; s++) {
          const r = (s / segs) * maxDist;
          angle += (Math.random() - 0.5) * 0.42;
          const nx = cx + Math.cos(angle) * r, ny = cy + Math.sin(angle) * r;
          ctx.lineTo(nx, ny);
          if (s >= 2 && Math.random() < 0.5) {
            const bA = angle + (Math.random() < 0.5 ? 0.6 : -0.6);
            ctx.moveTo(nx, ny);
            ctx.lineTo(nx + Math.cos(bA) * maxDist * 0.22, ny + Math.sin(bA) * maxDist * 0.22);
            ctx.moveTo(nx, ny);
          }
          x = nx; y = ny;
        }
        ctx.strokeStyle = 'rgba(226, 232, 240, 0.28)'; ctx.lineWidth = 6.5; ctx.lineCap = 'round'; ctx.stroke();
        ctx.strokeStyle = 'rgba(10, 14, 22, 0.94)'; ctx.lineWidth = 3.6; ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function registerDestructible(id, name, group, maxHp, centerPos, hpLabelOffsetY = 12, countInProgress = true) {
      const meshes = [], segmentParts = new Map(), structureParts = new Map();
      group.traverse((c) => {
        if (c.isMesh) {
          c.userData.smashId = id;
          if (c.material && !Array.isArray(c.material)) {
            c.material = c.material.clone();
            c.userData.origColor = c.material.color.clone();
          }
          meshes.push(c);
          if (c.userData.structureKey) {
            const k = c.userData.structureKey;
            c.userData.segmentKey = k;
            if (!structureParts.has(k)) structureParts.set(k, []);
            structureParts.get(k).push(c);
          } else if (c.userData.segmentKey) {
            if (!segmentParts.has(c.userData.segmentKey)) segmentParts.set(c.userData.segmentKey, []);
            segmentParts.get(c.userData.segmentKey).push(c);
          }
        }
      });

      const segHp = id === 'ground' ? 14 : 18;
      const cells = new Map();
      segmentParts.forEach((parts, key) => {
        const center = new THREE.Vector3();
        parts.forEach((p) => center.add(p.position));
        center.multiplyScalar(1 / Math.max(1, parts.length));
        cells.set(key, { key, parts, structureParts: structureParts.get(key) || [], center, hp: segHp, maxHp: segHp, broken: false });
      });
      if (cells.size > 0) maxHp = cells.size * segHp;

        const isPine = i % 3 === 0;
        const tree = isPine ? createPineTree(x, y, z, 0.9 + Math.random() * 0.8) : createDeciduousTree(x, y, z, 0.9 + Math.random() * 0.8);

    function panicStudentsNear(hitPoint, radius = 22) {
      students.forEach((st) => {
        const dist = Math.hypot(st.group.position.x - hitPoint.x, st.group.position.z - hitPoint.z);
        if (dist < radius) {
          st.panicTime = 3.5 + Math.random() * 1.5;
          st.panicDir.set(st.group.position.x - hitPoint.x, 0, st.group.position.z - hitPoint.z);
          if (st.panicDir.lengthSq() < 0.01) st.panicDir.set(Math.random() - 0.5, 0, Math.random() - 0.5);

        }
      });
    }

    function triggerWeaponOnTarget(targetId, hitPoint, directProp = null) {
      const target = targetId ? destructibles[targetId] : null;
      if (currentWeapon === 'meteor') launchMeteor(target, hitPoint, directProp);
      else if (currentWeapon === 'laser') fireOrbitalLaser(target, hitPoint, directProp);
      else if (currentWeapon === 'bomb') dropBomb(target, hitPoint, directProp);
      else if (currentWeapon === 'quake') triggerEarthquake();
    }

    function launchMeteor(target, hitPoint, directProp) {
      const mg = new THREE.Group();
      mg.add(new THREE.Mesh(new THREE.DodecahedronGeometry(2.1, 0), new THREE.MeshStandardMaterial({ color: 0xff4500, emissive: 0xff6a00, emissiveIntensity: 1.8, roughness: 0.6 })));
      const startPos = new THREE.Vector3(hitPoint.x - 24, hitPoint.y + 48, hitPoint.z - 18);
      mg.position.copy(startPos); scene.add(mg);
      activeProjectiles.push({
        mesh: mg, start: startPos, end: hitPoint.clone(), progress: 0, speed: 3.2,
        onImpact: () => {
          SoundFX.playExplosion(1.25);
          screenShakeIntensity = Math.max(screenShakeIntensity, 1.35);
          spawnShockwave(hitPoint, 0xff5500, 19);
          spawnDebris(hitPoint, 24, [0x475569, 0xff6a00, 0xfbbf24, 0x1e293b]);
          if (hitPoint.y <= 3.8 || !target || target.id === 'ground') spawnGroundCrack(hitPoint, 9.0);
          if (directProp) destroyProp(directProp);
          damagePropsInRadius(hitPoint, 9.5);
          panicStudentsNear(hitPoint, 26);
          if (target) applyDamage(target, 45, hitPoint, 7.0);
          Object.values(destructibles).forEach((o) => {
            if ((!target || o.id !== target.id) && !o.destroyed && o.countInProgress && o.center.distanceTo(hitPoint) < 20) {
              applyDamage(o, 20, o.center.clone(), 5.0);
            }
          });
        }
      });
    }

    function fireOrbitalLaser(target, hitPoint, directProp) {
      SoundFX.playLaser();
      screenShakeIntensity = Math.max(screenShakeIntensity, 1.2);
      const boltGroup = new THREE.Group();
      const top = hitPoint.clone().add(new THREE.Vector3(0, 46, 0));
      const pts = [top];
      for (let i = 1; i < 10; i++) {
        const t = i / 10;
        pts.push(new THREE.Vector3(
          THREE.MathUtils.lerp(top.x, hitPoint.x, t) + (Math.random() - 0.5) * 5.5,
          THREE.MathUtils.lerp(top.y, hitPoint.y, t),
          THREE.MathUtils.lerp(top.z, hitPoint.z, t) + (Math.random() - 0.5) * 4.5
        ));
      }
      pts.push(hitPoint.clone());
      const curve = new THREE.CatmullRomCurve3(pts);
      boltGroup.add(
        new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.55, 7, false), new THREE.MeshBasicMaterial({ color: 0x9333ea, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false })),
        new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.24, 7, false), new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending, depthWrite: false })),
        new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.1, 6, false), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }))
      );
      scene.add(boltGroup);
      activeEffects.push({
        mesh: boltGroup, life: 0.45, maxLife: 0.45,

          boltGroup.visible = r > 0.12 && Math.random() > 0.08;

      });
      spawnShockwave(hitPoint, 0x22d3ee, 15);
      spawnDebris(hitPoint, 22, [0x22d3ee, 0xe879f9, 0x94a3b8, 0x334155]);
      if (hitPoint.y <= 3.8 || !target || target.id === 'ground') spawnGroundCrack(hitPoint, 6.2);

      panicStudentsNear(hitPoint, 20);

    function triggerEarthquake() {
      SoundFX.playQuake();
      screenShakeIntensity = 2.0;
      for (let i = 0; i < 6; i++) spawnGroundCrack(new THREE.Vector3(-48 + Math.random() * 100, 0.2, -22 + Math.random() * 40), 6.5 + Math.random() * 4.5);
      destructibleProps.forEach((p) => { if (!p.destroyed && Math.random() < 0.45) destroyProp(p); });
      panicStudentsNear(new THREE.Vector3(0, 0, 0), 120);

      Object.values(destructibles).forEach((d) => {
        if (!d.destroyed && d.countInProgress) {
          const pt = d.center.clone().add(new THREE.Vector3(0, 4, 0));
          spawnDebris(pt, 12, [0x64748b, 0x475569, 0x94a3b8]);
          if (d.cells && d.cells.size > 0) {
            const unbroken = Array.from(d.cells.values()).filter((c) => !c.broken);
            const toBreak = Math.max(1, Math.ceil(d.cells.size * 0.36));
            for (let i = 0; i < Math.min(toBreak, unbroken.length); i++) {
              const cell = unbroken[Math.floor(Math.random() * unbroken.length)];
              if (!cell.broken) { d.hp = Math.max(0, d.hp - cell.hp); breakCellParts(cell, pt); }
            }
            if (d.hp / d.maxHp <= 0.4) collapseTarget(d, pt);
            updateTargetHpUI(d);
          } else {
            applyDamage(d, Math.ceil(d.maxHp * 0.45), pt, 4.0);
          }
        }
      });
      bumpCombo();
      updateDestructionHUD();
    }

    function breakCellParts(cell, impactPoint) {
      cell.broken = true; cell.hp = 0;
      [...cell.parts, ...(cell.structureParts || [])].forEach((part) => {
        if (!part.visible) return;
        part.updateWorldMatrix(true, false);
        const pos = part.getWorldPosition(new THREE.Vector3());
        part.visible = false;
        if (debrisParticles.length < 220) {
          const shard = part.clone(); shard.position.copy(pos); shard.userData = {}; scene.add(shard);
          const dir = pos.clone().sub(impactPoint).normalize();
          debrisParticles.push({
            mesh: shard,
            vel: dir.multiplyScalar(5 + Math.random() * 7).add(new THREE.Vector3((Math.random() - 0.5) * 6, 4 + Math.random() * 9, (Math.random() - 0.5) * 6)),
            rotVel: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8),
            life: 1.2 + Math.random() * 0.4
          });
        }
      });
    }

    function collapseTarget(target, impactPoint) {
      if (target.destroyed) return;
      target.destroyed = true; target.hp = 0; target.group.visible = false;
      const box = new THREE.Box3().setFromObject(target.group), size = box.getSize(new THREE.Vector3());
      const count = target.countInProgress ? 34 : 14;
      const srcMats = target.meshes.map((m) => m.material).filter(Boolean);
      for (let i = 0; i < count; i++) {
        if (debrisParticles.length > 260) scene.remove(debrisParticles.shift().mesh);
        const src = srcMats[Math.floor(Math.random() * srcMats.length)];
        const mat = new THREE.MeshStandardMaterial({ color: src && src.color ? src.color.clone().multiplyScalar(0.8) : 0x64748b, roughness: 0.85 });
        const chunk = new THREE.Mesh(sharedBoxGeo, mat);
        chunk.scale.set(Math.max(0.4, size.x / 7) * 0.7, Math.max(0.4, size.y / 5) * 0.7, Math.max(0.4, size.z / 4) * 0.7);
        chunk.position.set(box.min.x + Math.random() * Math.max(1, size.x), Math.max(0.8, box.min.y + Math.random() * Math.max(1, size.y)), box.min.z + Math.random() * Math.max(1, size.z));
        scene.add(chunk);
        const out = chunk.position.clone().sub(impactPoint).normalize();
        debrisParticles.push({
          mesh: chunk,
          vel: out.multiplyScalar(5 + Math.random() * 9).add(new THREE.Vector3((Math.random() - 0.5) * 6, 6 + Math.random() * 10, (Math.random() - 0.5) * 6)),
          rotVel: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8),
          life: 2.0 + Math.random() * 1.0
        });
      }
      SoundFX.playExplosion(1.4);
      screenShakeIntensity = Math.max(screenShakeIntensity, 1.7);
      spawnShockwave(impactPoint, 0xff6a00, 22);
      updateTargetHpUI(target);
      updateDestructionHUD();
    }

    function applyDamage(target, amount, hitPoint, splashRadius = 6.0) {
      if (!target || target.destroyed) return;
      if (target.cells && target.cells.size > 0) {
        const localHit = target.group.worldToLocal(hitPoint.clone());
        let hitAny = false;
        target.cells.forEach((cell) => {
          if (cell.broken) return;
          const dist = cell.center.distanceTo(localHit);
          if (dist <= splashRadius) {
            hitAny = true;
            const dmg = amount * Math.max(0.45, 1 - dist / (splashRadius * 1.25));
            const applied = Math.min(cell.hp, dmg);
            cell.hp = Math.max(0, cell.hp - applied);
            target.hp = Math.max(0, target.hp - applied);
            if (cell.hp <= 0) breakCellParts(cell, hitPoint);
          }
        });
        if (!hitAny) {
          let best = null, bestD = Infinity;
          target.cells.forEach((c) => { if (!c.broken) { const d = c.center.distanceTo(localHit); if (d < bestD) { bestD = d; best = c; } } });
          if (best) {
            const applied = Math.min(best.hp, amount);
            best.hp -= applied; target.hp = Math.max(0, target.hp - applied);
            if (best.hp <= 0) breakCellParts(best, hitPoint);
          }
        }
        if (target.countInProgress && target.hp / target.maxHp <= 0.4) collapseTarget(target, hitPoint);
      } else {
        target.hp = Math.max(0, target.hp - amount);
        if (target.hp <= 0) collapseTarget(target, hitPoint);
      }
      bumpCombo();
      updateTargetHpUI(target);
      updateDestructionHUD();
    }

      activeEffects.push({
        mesh: ring, life: 0.42, maxLife: 0.42,
        update(dt, r) { const s = 1 + (1 - r) * maxScale; ring.scale.set(s, s, 1); ring.material.opacity = r * 0.85; }
      });
    }

    function spawnDebris(origin, count, colorList) {

        mesh.scale.set(s, s * 0.8, s);
        mesh.position.copy(origin).add(new THREE.Vector3((Math.random() - 0.5) * 3, Math.random() * 2.5, (Math.random() - 0.5) * 3));
        scene.add(mesh);
        debrisParticles.push({
          mesh,
          vel: new THREE.Vector3((Math.random() - 0.5) * 18, 7 + Math.random() * 14, (Math.random() - 0.5) * 18),
          rotVel: new THREE.Vector3(Math.random() * 8, Math.random() * 8, Math.random() * 8),
          life: 0.75 + Math.random() * 0.45
        });

    function spawnSmokeOrFire(origin, isFire) {
      if (smokeParticles.length > 80) return;
      const mesh = new THREE.Mesh(sharedSphereGeo, new THREE.MeshBasicMaterial({ color: isFire ? (Math.random() > 0.5 ? 0xf97316 : 0xfacc15) : 0x334155, transparent: true, opacity: isFire ? 0.85 : 0.48 }));
      mesh.scale.setScalar(isFire ? 0.55 : 0.9);
      mesh.position.copy(origin).add(new THREE.Vector3((Math.random() - 0.5) * 4, 0.8 + Math.random(), (Math.random() - 0.5) * 4));
      scene.add(mesh);
      smokeParticles.push({ mesh, velY: isFire ? 4.0 : 2.3, life: isFire ? 0.5 : 1.3, maxLife: isFire ? 0.5 : 1.3, isFire });
    }

    function updateTargetHpUI(target) {
      if (!target.countInProgress) return;
      const fill = target.hpEl.querySelector('.hp-fill');
      const barWrap = target.hpEl.querySelector('.hp-bar-wrap');
      const badge = target.hpEl.querySelector('.hp-badge');
      const pct = Math.max(0, (target.hp / target.maxHp) * 100);
      if (target.destroyed) { barWrap.classList.add('hidden'); badge.classList.remove('hidden'); }
      else {
        barWrap.classList.remove('hidden'); badge.classList.add('hidden');
        fill.style.width = `${pct}%`;
        fill.className = `hp-fill h-full transition-all duration-150 ${pct > 50 ? 'bg-emerald-400' : pct > 25 ? 'bg-amber-400' : 'bg-rose-500'}`;
      }
    }

    function updateDestructionHUD() {
      let totalMax = 0, totalLost = 0;
      Object.values(destructibles).forEach((d) => { if (!d.countInProgress) return; totalMax += d.maxHp; totalLost += (d.maxHp - d.hp); });
      const pct = totalMax > 0 ? Math.round((totalLost / totalMax) * 100) : 0;
      document.getElementById('destruction-percent').textContent = `${pct}%`;
      document.getElementById('destruction-bar').style.width = `${pct}%`;
      if (pct >= 100 && !victoryShown) {
        victoryShown = true;
        setTimeout(() => document.getElementById('victory-overlay').classList.remove('hidden'), 500);
      }
    }

    function restoreCampus() {
      comboCount = 0; victoryShown = false;
      document.getElementById('combo-count').textContent = '0';
      document.getElementById('victory-overlay').classList.add('hidden');
      Object.values(destructibles).forEach((d) => {
        d.hp = d.maxHp; d.destroyed = false; d.group.visible = true;
        d.group.position.copy(d.basePos); d.group.rotation.copy(d.baseRot);
        d.hpEl.classList.add('hidden');
        if (d.cells) d.cells.forEach((c) => { c.hp = c.maxHp; c.broken = false; });
        d.meshes.forEach((m) => { m.visible = true; });
        updateTargetHpUI(d);
      });
      while (debrisParticles.length > 0) scene.remove(debrisParticles.pop().mesh);
      while (smokeParticles.length > 0) scene.remove(smokeParticles.pop().mesh);
      while (activeProjectiles.length > 0) scene.remove(activeProjectiles.pop().mesh);
      while (activeEffects.length > 0) scene.remove(activeEffects.pop().mesh);
      while (groundCracks.length > 0) { const c = groundCracks.pop(); scene.remove(c); c.geometry.dispose(); c.material.dispose(); }
      destructibleProps.forEach((p) => { p.destroyed = false; p.group.visible = true; });
      students.forEach((st) => { st.panicTime = 0; st.group.position.copy(st.pA); });
      screenShakeIntensity = 0;
      updateDestructionHUD();
    }

    // =========================================================================
    // 8. UI, 이벤트 및 메인 애니메이션 루프
    // =========================================================================
    function setMode(mode) {
      currentMode = mode;
      if (attackAimRing) attackAimRing.visible = mode === 'smash';
      const bt = document.getElementById('mode-tour'), bs = document.getElementById('mode-smash');
      if (mode === 'smash') {
        closePanel('all');
        bs.className = 'px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-gradient-to-r from-orange-500 to-rose-600 text-white shadow-sm';
        bt.className = 'px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-white/80 hover:text-white';
        document.getElementById('smash-hud').classList.remove('hidden');
        document.getElementById('tour-nav').classList.add('hidden');
        document.getElementById('smash-nav').classList.remove('hidden');
        document.getElementById('btn-sound').classList.remove('hidden');
      } else {
        bt.className = 'px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-white text-blue-900 shadow-sm';
        bs.className = 'px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all text-white/80 hover:text-white';
        document.getElementById('smash-hud').classList.add('hidden');
        document.getElementById('tour-nav').classList.remove('hidden');
        document.getElementById('smash-nav').classList.add('hidden');
        document.getElementById('btn-sound').classList.add('hidden');
        document.getElementById('victory-overlay').classList.add('hidden');
      }
    }

    function buildUI() {
      const quickNav = document.getElementById('quick-nav'), lc = document.getElementById('labels-container');
      const addBtn = (id, emoji, text, active, onClick) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.id = id;
        b.className = active
          ? 'quick-btn flex-shrink-0 flex items-center gap-1.5 bg-blue-900 text-white px-3.5 py-2 rounded-full text-xs sm:text-sm font-bold shadow-sm transition active:scale-95'
          : 'quick-btn flex-shrink-0 flex items-center gap-1.5 bg-white/90 hover:bg-white text-slate-700 px-3.5 py-2 rounded-full text-xs sm:text-sm font-bold border border-slate-200/80 transition active:scale-95';
        b.innerHTML = `<span>${emoji}</span><span>${text}</span>`;
        b.addEventListener('click', onClick);
        quickNav.appendChild(b);
      };
      addBtn('all', '🗺️', '전체', true, () => moveCameraPreset('all'));
      addBtn('map', '🛰️', '지도 시점(위에서)', false, () => moveCameraPreset('map'));
      ['parking', 'main', 'engineering', 'health'].forEach((k) => {
        const item = CAMPUS_DATA[k];
        addBtn(item.id, item.emoji, item.shortName, false, () => selectZone(item.id));
        const lbl = document.createElement('div');
        lbl.className = 'floating-label flex items-center gap-1.5 bg-white/92 hover:bg-white backdrop-blur-md px-3 py-1 rounded-full shadow-md border border-slate-200/90 text-xs font-extrabold text-slate-800';
        lbl.innerHTML = `<span class="text-sm">${item.emoji}</span><span>${item.shortName}</span>`;
        lbl.addEventListener('click', (e) => {
          e.stopPropagation();
          if (currentMode === 'tour') selectZone(item.id);
          else if (destructibles[item.id]) triggerWeaponOnTarget(item.id, destructibles[item.id].center.clone().add(new THREE.Vector3(0, 5, 0)));
        });
        lc.appendChild(lbl);
        labelElements[item.id] = lbl;
      });
      CONTEXT_LABELS.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'context-label px-2 py-0.5 rounded-full bg-slate-800/55 backdrop-blur-sm text-[10px] font-bold text-white/95 shadow-sm';
        el.textContent = c.text;
        lc.appendChild(el);
        contextLabelElements.push({ el, pos: c.pos });
      });
    }

    function moveCameraPreset(key) {
      closePanel(key);
      targetCamPos.set(...CAMERA_PRESETS[key].pos);
      targetLookAt.set(...CAMERA_PRESETS[key].lookAt);
      isCameraAnimating = true;
    }

    function selectZone(id) {
      const data = CAMPUS_DATA[id]; if (!data) return;
      selectedId = id;
      targetCamPos.set(...data.cameraPos); targetLookAt.set(...data.lookAt); isCameraAnimating = true;
      if (selectionRing && data.ringPos) { selectionRing.position.set(...data.ringPos); selectionRing.visible = true; }
      updateQuickNavStyle(id); renderInfoPanel(data);
      const panel = document.getElementById('info-panel');
      panel.classList.remove('translate-y-full', 'md:translate-x-[120%]', 'opacity-0', 'pointer-events-none');
      panel.classList.add('translate-y-0', 'md:translate-x-0', 'opacity-100', 'pointer-events-auto');
      if (window.innerWidth < 768) document.getElementById('tour-nav').classList.add('opacity-0', 'pointer-events-none');
    }

    function closePanel(activeNavId = 'all') {
      selectedId = null; if (selectionRing) selectionRing.visible = false;
      updateQuickNavStyle(activeNavId);
      const panel = document.getElementById('info-panel');
      panel.classList.add('translate-y-full', 'md:translate-x-[120%]', 'opacity-0', 'pointer-events-none');
      panel.classList.remove('translate-y-0', 'md:translate-x-0', 'opacity-100', 'pointer-events-auto');
      document.getElementById('tour-nav').classList.remove('opacity-0', 'pointer-events-none');
    }

    function updateQuickNavStyle(activeId) {
      document.querySelectorAll('.quick-btn').forEach((b) => {
        const a = b.dataset.id === activeId;
        b.classList.toggle('bg-blue-900', a); b.classList.toggle('text-white', a);
        b.classList.toggle('bg-white/90', !a); b.classList.toggle('text-slate-700', !a);
      });
    }

    function renderInfoPanel(data) {
      const b = document.getElementById('panel-badge');
      b.textContent = data.badge; b.className = `inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold ${data.badgeColor}`;
      document.getElementById('panel-walk').textContent = `🚶 ${data.walkTime}`;
      document.getElementById('panel-title').textContent = `${data.emoji} ${data.name}`;
      document.getElementById('panel-desc').textContent = data.summary;
      document.getElementById('panel-landmarks').innerHTML = data.landmarks.map((lm) => `<span class="flex-shrink-0 inline-flex items-center px-2.5 py-1 rounded-full bg-white border border-blue-200/80 text-[11px] font-bold text-blue-900 shadow-sm">${lm}</span>`).join('');
      const tabsEl = document.getElementById('floor-tabs'); tabsEl.innerHTML = '';
      data.floors.forEach((fl, idx) => {
        const tab = document.createElement('button'); tab.type = 'button'; tab.textContent = fl.label;
        tab.className = idx === 0
          ? 'flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-900 text-white shadow-sm transition'
          : 'flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition';
        tab.addEventListener('click', () => {
          Array.from(tabsEl.children).forEach((btn, i) => {
            btn.className = i === idx
              ? 'flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold bg-blue-900 text-white shadow-sm transition'
              : 'flex-shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition';
          });
          renderFloorDetail(fl);
        });
        tabsEl.appendChild(tab);
      });
      renderFloorDetail(data.floors[0]);
    }

    function renderFloorDetail(floor) {
      document.getElementById('floor-content').innerHTML = `
        <div>
          <h3 class="text-xs font-extrabold text-slate-500 uppercase tracking-wider mb-2.5">📍 ${floor.label} 주요 시설 안내</h3>
          <ul class="space-y-2">${floor.facilities.map((fac) => `
            <li class="flex items-center gap-2.5 bg-slate-50 rounded-2xl px-3.5 py-2.5 border border-slate-100 shadow-sm">
              <span class="w-2 h-2 rounded-full bg-blue-600 flex-shrink-0"></span>
              <span class="text-xs sm:text-sm font-bold text-slate-800">${fac}</span>
            </li>`).join('')}
          </ul>
        </div>`;
    }

    function toggleTheme() {
      isSunset = !isSunset;
      document.getElementById('theme-icon').textContent = isSunset ? '🌇' : '☀️';
      document.getElementById('theme-text').textContent = isSunset ? '노을 모드' : '낮 모드';
      scene.background.setHex(isSunset ? 0xfdba74 : 0xcde5fc);
      scene.fog.color.setHex(isSunset ? 0xfdba74 : 0xcde5fc);
      dirLight.color.setHex(isSunset ? 0xffedd5 : 0xfffbeb);
      dirLight.intensity = isSunset ? 1.1 : 0.95;
      dirLight.position.set(isSunset ? -55 : 45, isSunset ? 28 : 75, isSunset ? -35 : -50);
      streetLampBulbs.forEach((m) => (m.emissiveIntensity = isSunset ? 1.6 : 0.15));
    }

    function bindEvents() {
      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', (e) => { pointerDownPos.x = e.clientX; pointerDownPos.y = e.clientY; });
      dom.addEventListener('pointermove', (e) => {
        if (!attackAimRing || currentMode !== 'smash') return;
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const targets = Object.values(destructibles).filter((d) => !d.destroyed).map((d) => d.group);
        const hits = raycaster.intersectObjects(targets, true);
        let pt = null, normal = new THREE.Vector3(0, 1, 0);
        if (hits.length) {
          pt = hits[0].point.clone();
          if (hits[0].face) normal.copy(hits[0].face.normal).applyMatrix3(new THREE.Matrix3().getNormalMatrix(hits[0].object.matrixWorld)).normalize();
        } else {
          pt = raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), new THREE.Vector3());
        }
        attackAimRing.visible = !!pt;
        if (pt) {
          attackAimRing.position.copy(pt).addScaledVector(normal, 0.08);
          attackAimRing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
          attackAimRing.scale.setScalar((weaponRadii[currentWeapon] || 6.0) * 0.4);
          attackAimRing.material.color.setHex(currentWeapon === 'laser' ? 0x67e8f9 : currentWeapon === 'bomb' ? 0xff5b35 : 0xffb21a);
        }
      });
      dom.addEventListener('pointerleave', () => { if (attackAimRing) attackAimRing.visible = false; });

      dom.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 8) return;
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        if (currentMode === 'tour') {
          const hits = raycaster.intersectObjects(Object.values(tourZones).map((z) => z.group), true);
          if (hits.length > 0 && hits[0].object.userData.tourId) selectZone(hits[0].object.userData.tourId);
        } else {
          const bTargets = Object.values(destructibles).filter((d) => !d.destroyed).map((d) => d.group);
          const pTargets = destructibleProps.filter((p) => !p.destroyed).map((p) => p.group);
          const hits = raycaster.intersectObjects([...bTargets, ...pTargets], true);
          const hit = hits.find((it) => it.object.visible && (it.object.userData.smashId || it.object.userData.propIndex !== undefined));
          if (hit) {
            if (hit.object.userData.propIndex !== undefined) triggerWeaponOnTarget(null, hit.point, destructibleProps[hit.object.userData.propIndex]);
            else triggerWeaponOnTarget(hit.object.userData.smashId, hit.point, null);
          } else {
            const pt = raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), new THREE.Vector3());
            if (pt) triggerWeaponOnTarget(null, pt, null);
          }
        }
      });

      document.getElementById('mode-tour').addEventListener('click', () => setMode('tour'));
      document.getElementById('mode-smash').addEventListener('click', () => setMode('smash'));
      document.getElementById('btn-theme').addEventListener('click', toggleTheme);
      document.getElementById('btn-close-panel').addEventListener('click', () => closePanel('all'));
      document.getElementById('btn-restore').addEventListener('click', restoreCampus);
      document.getElementById('btn-victory-restore').addEventListener('click', restoreCampus);
      document.getElementById('btn-victory-close').addEventListener('click', () => document.getElementById('victory-overlay').classList.add('hidden'));
      document.getElementById('btn-sound').addEventListener('click', () => {
        SoundFX.muted = !SoundFX.muted;
        document.getElementById('btn-sound').textContent = SoundFX.muted ? '🔇' : '🔊';
      });
      document.querySelectorAll('.weapon-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const w = btn.dataset.weapon;
          if (w === 'quake') { triggerEarthquake(); return; }
          currentWeapon = w;
          document.querySelectorAll('.weapon-btn').forEach((b) => {
            if (b.dataset.weapon === 'quake') return;
            const a = b.dataset.weapon === w;
            b.className = a
              ? 'weapon-btn flex flex-col sm:flex-row items-center gap-1 sm:gap-1.5 px-3 sm:px-4 py-2 rounded-2xl text-xs sm:text-sm font-extrabold transition-all active:scale-95 bg-gradient-to-r from-orange-500 to-rose-600 text-white shadow-lg ring-2 ring-amber-300'
              : 'weapon-btn flex flex-col sm:flex-row items-center gap-1 sm:gap-1.5 px-3 sm:px-4 py-2 rounded-2xl text-xs sm:text-sm font-extrabold transition-all active:scale-95 bg-white/10 hover:bg-white/20 text-white/90';
          });
        });
      });
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function updateOverlays() {
      const v = new THREE.Vector3(), hw = window.innerWidth / 2, hh = window.innerHeight / 2;
      Object.values(CAMPUS_DATA).forEach((item) => {
        const el = labelElements[item.id]; if (!el) return;
        v.set(...item.labelPos).project(camera);
        if (v.z > 1) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; return; }
        el.style.opacity = currentMode === 'smash' ? '0.65' : '1';
        el.style.pointerEvents = 'auto';
        el.style.transform = `translate(-50%, -50%) translate(${v.x * hw + hw}px, ${-(v.y * hh) + hh}px)`;
      });
      contextLabelElements.forEach(({ el, pos }) => {
        v.set(...pos).project(camera);
        if (v.z > 1) { el.style.opacity = '0'; return; }
        el.style.opacity = currentMode === 'smash' ? '0.45' : '0.88';
        el.style.transform = `translate(-50%, -50%) translate(${v.x * hw + hw}px, ${-(v.y * hh) + hh}px)`;
      });
      Object.values(destructibles).forEach((d) => {
        const show = currentMode === 'smash' && d.countInProgress && (d.hp < d.maxHp || d.destroyed);
        if (!show) { d.hpEl.classList.add('hidden'); return; }
        v.copy(d.hpLabelPos).project(camera);
        if (v.z > 1) { d.hpEl.classList.add('hidden'); return; }
        d.hpEl.classList.remove('hidden');
        d.hpEl.style.transform = `translate(-50%, -50%) translate(${v.x * hw + hw}px, ${-(v.y * hh) + hh}px)`;
      });
    }

    let lastFrameTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now(), dt = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      const time = now * 0.001;

      if (isCameraAnimating) {
        camera.position.lerp(targetCamPos, 0.08);
        controls.target.lerp(targetLookAt, 0.08);
        if (camera.position.distanceTo(targetCamPos) < 0.18 && controls.target.distanceTo(targetLookAt) < 0.18) isCameraAnimating = false;
      }

      if (screenShakeIntensity > 0.02) {
        camera.position.x += (Math.random() - 0.5) * screenShakeIntensity;
        camera.position.y += (Math.random() - 0.5) * screenShakeIntensity;
        screenShakeIntensity *= 0.86;
      }

      // 3D 학생 이동 및 도망 애니메이션
      students.forEach((st) => {
        let spd = st.speed;
        if (st.panicTime > 0) {
          st.panicTime -= dt;
          spd = st.speed * 2.8;
          st.group.position.addScaledVector(st.panicDir, spd * dt);
          st.group.position.x = THREE.MathUtils.clamp(st.group.position.x, -56, 54);
          st.group.position.z = THREE.MathUtils.clamp(st.group.position.z, -24, 24);
          st.group.rotation.y = Math.atan2(st.panicDir.x, st.panicDir.z);
        } else {
          const target = st.dir === 1 ? st.pB : st.pA;
          const dx = target.x - st.group.position.x, dz = target.z - st.group.position.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 0.4) { st.dir *= -1; }
          else {
            st.group.position.x += (dx / dist) * spd * dt;
            st.group.position.z += (dz / dist) * spd * dt;
            st.group.rotation.y = Math.atan2(dx, dz);
          }
        }
        const swing = Math.sin(time * (st.panicTime > 0 ? 15 : 8) + st.phase) * (st.panicTime > 0 ? 0.75 : 0.45);
        st.legL.rotation.x = swing; st.legR.rotation.x = -swing;
        st.armL.rotation.x = -swing * 0.8; st.armR.rotation.x = swing * 0.8;
      });

      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const p = activeProjectiles[i];
        p.progress += dt * p.speed;
        p.mesh.position.lerpVectors(p.start, p.end, Math.min(1, p.progress));
        p.mesh.rotation.x += dt * 7; p.mesh.rotation.y += dt * 5;
        if (Math.random() < 0.55) spawnSmokeOrFire(p.mesh.position, true);
        if (p.progress >= 1) { scene.remove(p.mesh); p.onImpact(); activeProjectiles.splice(i, 1); }
      }

      for (let i = activeEffects.length - 1; i >= 0; i--) {
        const ef = activeEffects[i]; ef.life -= dt;
        ef.update(dt, Math.max(0, ef.life / ef.maxLife));
        if (ef.life <= 0) { scene.remove(ef.mesh); activeEffects.splice(i, 1); }
      }

      for (let i = debrisParticles.length - 1; i >= 0; i--) {
        const dp = debrisParticles[i]; dp.life -= dt; dp.vel.y -= 34 * dt;
        dp.mesh.position.addScaledVector(dp.vel, dt);
        dp.mesh.rotation.x += dp.rotVel.x * dt; dp.mesh.rotation.y += dp.rotVel.y * dt;
        if (dp.mesh.position.y < 0.35) { dp.mesh.position.y = 0.35; dp.vel.y *= -0.42; dp.vel.x *= 0.72; dp.vel.z *= 0.72; }
        if (dp.life <= 0) { scene.remove(dp.mesh); debrisParticles.splice(i, 1); }
      }

      for (let i = smokeParticles.length - 1; i >= 0; i--) {
        const sp = smokeParticles[i]; sp.life -= dt; sp.mesh.position.y += sp.velY * dt;
        sp.mesh.scale.multiplyScalar(1 + dt * 0.6);
        sp.mesh.material.opacity = Math.max(0, (sp.life / sp.maxLife) * (sp.isFire ? 0.85 : 0.45));
        if (sp.life <= 0) { scene.remove(sp.mesh); smokeParticles.splice(i, 1); }
      }

      Object.values(destructibles).forEach((d) => {
        if (d.destroyed && d.countInProgress && Math.random() < 0.06) spawnSmokeOrFire(d.center, Math.random() < 0.35);
      });

      if (selectionRing && selectionRing.visible) {
        const s = 1 + Math.sin(time * 3.5) * 0.04;
        selectionRing.scale.set(s, s, 1);
      }
      if (schoolBusGroup && destructibles.bus && !destructibles.bus.destroyed) {
        schoolBusGroup.position.y = 0.18 + Math.sin(time * 5.5) * 0.015;
      }

      controls.update();
      updateOverlays();
      renderer.render(scene, camera);
    }

    window.addEventListener('load', init);
    if (document.readyState === 'complete') init();
  </script>
</body>
